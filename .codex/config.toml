# Role model settings for paper_research only.
# Keep the personal ~/.codex/agents definitions unchanged.

[agents.architecture-reviewer]
description = "Architecture review and recommendation. Use for system design, module boundaries, ADRs, and tradeoff analysis."
config_file = "agents/architecture-reviewer.toml"

[agents.backend-engineer]
description = "Backend implementation. Use for API, authentication, DB migration work."
config_file = "agents/backend-engineer.toml"

[agents.db-engineer]
description = "Database design and implementation specialist. Use for schema, ERD, migration, query tuning, vector DB work."
config_file = "agents/db-engineer.toml"

[agents.debug-investigator]
description = "Bug diagnosis and fix specialist. Error analysis, root cause identification, regression test writing."
config_file = "agents/debug-investigator.toml"

[agents.docs-curator]
description = "Documentation drift detection and sync specialist. Use to update docs/**/*.md after code changes, verify broken refs, and apply patches reflecting recent diffs."
config_file = "agents/docs-curator.toml"

[agents.frontend-engineer]
description = "React/Next.js/TypeScript frontend implementation. Use for UI, components, styling work."
config_file = "agents/frontend-engineer.toml"

[agents.mobile-engineer]
description = "Flutter/React Native mobile implementation. Use for mobile app, widgets, platform feature work."
config_file = "agents/mobile-engineer.toml"

[agents.pm-planner]
description = "PM requirements analysis, task decomposition, API contract definition agent"
config_file = "agents/pm-planner.toml"

[agents.qa-reviewer]
description = "OWASP security, performance, accessibility, code quality review agent"
config_file = "agents/qa-reviewer.toml"

[agents.refactor-engineer]
description = "Behavior-preserving refactoring specialist. Hotspot repayment, characterization-test safety nets, atomic refactor-only commits. Never changes observable behavior."
config_file = "agents/refactor-engineer.toml"

[agents.research-explorer]
description = "Cross-source research specialist. Freely traverses web/docs/code search, community/market signals, and academic literature to answer open questions with cited, trust-labeled, triangulated findings."
config_file = "agents/research-explorer.toml"

[agents.tf-infra-engineer]
description = "Terraform infrastructure implementation and review. Use for cloud provisioning, IAM/OIDC, networking, and terraform plan review."
config_file = "agents/tf-infra-engineer.toml"
