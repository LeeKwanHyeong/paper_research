   <g id="text_25">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #28624f" transform="translate(716.8896 330.496837)">All branches read lag one.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #28624f" transform="translate(716.8896 343.594259)">Thresholds govern availability,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #28624f" transform="translate(716.8896 356.691681)">not different retrieval lags.</text>
   </g>
   <g id="text_26">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #425b75" transform="translate(707.2128 405.042189)">No online associative update</text>
