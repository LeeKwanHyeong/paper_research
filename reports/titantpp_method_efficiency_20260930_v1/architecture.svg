   </g>
   <g id="text_27">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #14283f" x="504" y="716.23728" transform="rotate(-0 504 716.23728)">The next-event target is withheld from the encoder and enters the loss only.</text>
